name: MoonBit CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MoonBit
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | MOONBIT_INSTALL_VERSION=0.10.3 bash
          export PATH="$HOME/.moon/bin:$PATH"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          moon version --all

      - name: Check Formatting
        run: |
          moon fmt
          git diff --exit-code

      - name: Check Info
        run: |
          moon info
          git diff --exit-code

      - name: Build and Check
        run: moon check

      - name: Run Tests
        run: moon test
