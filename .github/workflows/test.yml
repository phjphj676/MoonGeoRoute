name: MoonBit CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build_and_test:
    name: build-and-test (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [native, wasm, wasm-gc, js]
    steps:
      - uses: actions/checkout@v5

      - name: Setup MoonBit
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          export PATH="$HOME/.moon/bin:$PATH"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          moon version --all

      - name: Check Formatting
        run: |
          moon fmt $(find . -type f \( -name '*.mbt' -o -name '*.mbt.md' \))
          git diff --exit-code -- . ':!cmd/main/moon.pkg'

      - name: Check Info
        run: moon info

      - name: Build and Check
        run: moon check --deny-warn --target ${{ matrix.target }}

      - name: Run Tests
        run: moon test --deny-warn --target ${{ matrix.target }}
